<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copiloto de Ventas</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --brand:#0b5fff; --ink:#1b2430; --mute:#6b7787; --me:#dce8ff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); height:100dvh; display:flex; flex-direction:column; }
  header { background:var(--brand); color:#fff; padding:8px 16px 10px; }
  header .top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0; font-weight:600; opacity:.9; }
  header .right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  header button, header select, header a { background:rgba(255,255,255,.2); border:0; color:#fff; padding:5px 10px; border-radius:6px; cursor:pointer; font:inherit; font-size:12px; text-decoration:none; }
  header select option { color:#1b2430; }
  header .info { display:flex; justify-content:space-between; align-items:center; gap:8px 16px; flex-wrap:wrap; margin-top:6px; }
  header .quien { display:flex; flex-direction:column; line-height:1.2; }
  #h_nombre { font-size:20px; font-weight:700; }
  #h_empresa { font-size:13px; opacity:.95; }
  header .chips2 { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { background:rgba(255,255,255,.18); border-radius:14px; padding:4px 10px; font-size:12px; white-space:nowrap; }
  #cupo { font-weight:700; }
  #cupo.poco { background:#ffb020; color:#3a2600; }
  #cupo.cero { background:#d93025; color:#fff; }
  #t:disabled, form#f button:disabled { cursor:not-allowed; }
  #t:disabled { background:#eef1f5; }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:12px; line-height:1.45; white-space:pre-wrap; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .me { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; }
  .bot blockquote { margin:8px 0; padding:8px 10px; background:#f1f7ee; border-left:4px solid #3aa655; border-radius:4px; position:relative; }
  .copy { display:inline-block; margin-top:4px; font-size:12px; background:#fff; border:1px solid #cfd6df; border-radius:6px; padding:2px 8px; cursor:pointer; color:var(--mute); }
  .fb { display:flex; gap:6px; margin-top:6px; }
  .fb button { background:#fff; border:1px solid #cfd6df; border-radius:6px; padding:2px 8px; cursor:pointer; font-size:14px; }
  .fb button:disabled { opacity:.5; cursor:default; }
  #chips { display:flex; gap:8px; flex-wrap:wrap; padding:0 14px 8px; }
  #chips button { background:#fff; border:1px solid #cfd6df; border-radius:16px; padding:6px 12px; cursor:pointer; font-size:13px; }
  form#f { display:flex; gap:8px; padding:10px; background:#fff; border-top:1px solid #e1e6ec; }
  textarea { flex:1; resize:none; border:1px solid #cfd6df; border-radius:10px; padding:10px; font:inherit; max-height:120px; }
  form#f button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:0 18px; font-weight:600; cursor:pointer; }
  form#f button:disabled { opacity:.5; }
  /* Pantalla de acceso */
  #login { position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #login .box { background:#fff; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.12); padding:24px; width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; }
  #login h2 { margin:0; font-size:20px; }
  #login p { margin:0; color:var(--mute); font-size:14px; }
  #login input { border:1px solid #cfd6df; border-radius:8px; padding:10px; font:inherit; }
  #login button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px; font-weight:600; cursor:pointer; font:inherit; }
  #login button:disabled { opacity:.5; }
  #lerr { color:#c0392b; font-size:13px; min-height:16px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🚗 Copiloto de Ventas</h1>
    <div class="right">
      <select id="empresa" style="display:none"></select>
      <a id="adminlink" href="/admin.html" style="display:none">⚙️ Admin</a>
      <button id="reset">Nueva consulta</button>
      <button id="salir">Salir</button>
    </div>
  </div>
  <div class="info">
    <div class="quien"><span id="h_nombre"></span><span id="h_empresa"></span></div>
    <div class="chips2">
      <span class="pill" id="h_mercado" style="display:none"></span>
      <span class="pill" id="cupo"></span>
    </div>
  </div>
</header>
<div id="chat"></div>
<div id="chips">
  <button>Un cliente no me responde, ¿qué le escribo?</button>
  <button>Cliente que no vuelve al concesionario</button>
  <button>Retomar un cliente de hace más de 30 días</button>
</div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Cuéntame tu situación con el cliente..."></textarea>
  <button id="send">Enviar</button>
</form>

<div id="login">
  <form class="box" id="lf">
    <h2>🚗 Copiloto de Ventas</h2>
    <p>Ingresa con tu correo y clave.</p>
    <input id="le" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="lp" type="password" placeholder="Clave" autocomplete="current-password" required>
    <div id="lerr"></div>
    <button id="lb">Ingresar</button>
  </form>
</div>

<script>
const chat = document.getElementById("chat");
const t = document.getElementById("t");
const send = document.getElementById("send");
const $ = (id) => document.getElementById(id);
let history = JSON.parse(sessionStorage.getItem("h") || "[]");
let me = null;           // datos del usuario (/api/me)
let empresaSel = "";     // solo administrador

// ---------- sesión (guardada en este navegador) ----------
function getSess() { try { return JSON.parse(localStorage.getItem("sess") || "null"); } catch { return null; } }
function setSess(s) { try { s ? localStorage.setItem("sess", JSON.stringify(s)) : localStorage.removeItem("sess"); } catch {} }

async function refrescar() {
  const s = getSess(); if (!s?.refresh_token) return false;
  try {
    const r = await fetch("/api/refresh", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    if (!r.ok) return false;
    setSess(await r.json()); return true;
  } catch { return false; }
}

// fetch con el token; si venció, intenta renovar una vez
async function api(path, opts = {}, reintento = true) {
  const s = getSess();
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}), Authorization: "Bearer " + (s?.access_token || "") } });
  if (r.status === 401 && reintento && (await refrescar())) return api(path, opts, false);
  if (r.status === 401) { mostrarLogin(); }
  return r;
}

function mostrarLogin(msg) { $("lerr").textContent = msg || ""; $("login").style.display = "flex"; $("le").focus(); }

$("lf").onsubmit = async (e) => {
  e.preventDefault(); $("lb").disabled = true; $("lerr").textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("le").value, password: $("lp").value }) });
    const j = await r.json();
    if (!r.ok) { $("lerr").textContent = j.error || "No se pudo ingresar"; }
    else { setSess(j); $("lp").value = ""; $("login").style.display = "none"; await iniciar(); }
  } catch { $("lerr").textContent = "Sin conexión. Intenta de nuevo."; }
  $("lb").disabled = false;
};

$("salir").onclick = () => { setSess(null); sessionStorage.removeItem("h"); location.reload(); };

// ---------- encabezado: nombre, cupo diario, empresa (admin) ----------
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function pintarCupo(usadas, limite) {
  const el = $("cupo");
  el.className = "pill";
  if (limite == null) { el.textContent = "Consultas: sin límite"; bloquear(false); return; }
  const quedan = Math.max(limite - usadas, 0);
  el.textContent = `Consultas hoy: ${usadas}/${limite}`;
  if (quedan === 0) el.classList.add("cero"); else if (quedan <= 3) el.classList.add("poco");
  bloquear(quedan === 0, limite);
}
// Sin consultas disponibles: no se puede escribir ni enviar hasta mañana (el servidor también lo impide)
function bloquear(si, limite) {
  t.disabled = si; send.disabled = si;
  document.querySelectorAll("#chips button").forEach(b => b.disabled = si);
  t.placeholder = si ? `Llegaste a tu límite de ${limite} consultas de hoy. Se reinicia a las 00:00.` : "Cuéntame tu situación con el cliente...";
  if (si && !document.getElementById("avisoLimite")) {
    const d = document.createElement("div"); d.id = "avisoLimite"; d.className = "msg bot";
    d.textContent = `⛔ Llegaste a tu límite de ${limite} consultas de hoy. Se reinicia a las 00:00. Si necesitas más, pídeselo a tu administrador.`;
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  }
  if (!si) document.getElementById("avisoLimite")?.remove();
}
function pintarEncabezado() {
  $("h_nombre").textContent = me?.nombre || "";
  $("h_empresa").textContent = me?.empresa?.nombre ? "Empresa: " + me.empresa.nombre : "";
  const m = $("h_mercado");
  if (me?.mercado_hasta) { const a = Math.floor(me.mercado_hasta / 100), mes = me.mercado_hasta % 100; m.textContent = `Dato mercado hasta: ${MESES[mes - 1]} ${a}`; m.style.display = ""; }
  else { m.textContent = "Dato mercado: sin cargar"; m.style.display = ""; }
}

async function cargarMe() {
  const r = await api("/api/me" + (empresaSel ? "?empresa_id=" + encodeURIComponent(empresaSel) : ""));
  if (!r.ok) return false;
  me = await r.json();
  pintarEncabezado();
  pintarCupo(me.usadas, me.limite);
  $("adminlink").style.display = me.rol === "admin" ? "" : "none";
  if (me.rol === "admin" && me.empresas?.length) {
    const sel = $("empresa");
    sel.innerHTML = '<option value="">Empresa…</option>' + me.empresas.map(e => `<option value="${e.id}">${e.nombre}</option>`).join("");
    sel.value = empresaSel || me.empresa?.id || "";
    if (!empresaSel && sel.value) empresaSel = sel.value;
    sel.style.display = "";
  }
  return true;
}
$("empresa").onchange = async (e) => { empresaSel = e.target.value; history = []; sessionStorage.removeItem("h"); chat.innerHTML = ""; await cargarMe(); saludo(); pintarCupo(me.usadas, me.limite); };

// ---------- chat ----------
function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function render(role, text, logId) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "bot");
  if (role === "user") { d.textContent = text; }
  else {
    // Convierte bloques "> mensaje" en cajas copiables y **negritas**
    const lines = esc(text).split("\n");
    let html = "", quote = [];
    const flush = () => { if (quote.length) { html += `<blockquote>${quote.join("\n")}</blockquote><span class="copy">Copiar</span>`; quote = []; } };
    for (const l of lines) {
      if (l.startsWith("&gt;")) quote.push(l.replace(/^&gt;\s?/, ""));
      else { flush(); html += l + "\n"; }
    }
    flush();
    d.innerHTML = html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    d.querySelectorAll(".copy").forEach(b => b.onclick = () => {
      navigator.clipboard.writeText(b.previousElementSibling.innerText);
      b.textContent = "Copiado ✓"; setTimeout(() => b.textContent = "Copiar", 1500);
    });
    if (logId) {
      const fb = document.createElement("div"); fb.className = "fb";
      fb.innerHTML = '<button title="Me sirvió">👍</button><button title="No me sirvió">👎</button>';
      fb.querySelectorAll("button").forEach((b, i) => b.onclick = async () => {
        fb.querySelectorAll("button").forEach(x => x.disabled = true);
        await api("/api/feedback", { method: "POST", body: JSON.stringify({ log_id: logId, util: i === 0 }) });
        b.style.background = "#dff3e3";
      });
      d.appendChild(fb);
    }
  }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask(text) {
  history.push({ role: "user", content: text });
  render("user", text);
  $("chips").style.display = "none";
  send.disabled = true;
  const wait = render("assistant", "Pensando…");
  try {
    const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ messages: history, empresa_id: empresaSel || undefined }) });
    const j = await r.json().catch(() => ({}));
    wait.remove();
    if (r.status === 401) { history.pop(); chat.lastChild.remove(); }
    else if (!r.ok || j.error) {
      render("assistant", "⚠️ " + (j.error || "Error del agente, intenta de nuevo")); history.pop();
      if (r.status === 429 && j.limite != null) pintarCupo(j.usadas, j.limite);
    } else {
      history.push({ role: "assistant", content: j.reply }); render("assistant", j.reply, j.log_id);
      if (j.limite != null) pintarCupo(j.usadas, j.limite);
    }
  } catch { wait.remove(); render("assistant", "⚠️ Sin conexión. Intenta de nuevo."); history.pop(); }
  sessionStorage.setItem("h", JSON.stringify(history));
  if (!t.disabled) { send.disabled = false; t.focus(); }
}

$("f").onsubmit = e => {
  e.preventDefault();
  const v = t.value.trim(); if (!v || send.disabled) return;
  t.value = ""; ask(v);
};
t.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); } };
document.querySelectorAll("#chips button").forEach(b => b.onclick = () => ask(b.textContent));
$("reset").onclick = () => { history = []; sessionStorage.removeItem("h"); location.reload(); };

function saludo() {
  const nom = me?.nombre ? " " + me.nombre.split(" ")[0] : "";
  render("assistant", `Hola${nom}, soy tu copiloto de ventas. Cuéntame qué pasa con tu cliente y te armo el mensaje y la mejor acción para avanzar.\n\n📌 Metas de hoy (lo de hoy es fruto de la disciplina de ayer):\n• 5 citas programadas\n• 3 citas efectivas\n• Test drives, reservas y solicitudes de crédito\n• Walk-in: atiéndelo bien y dale seguimiento en 24 h\n\n¿En qué palanca vas hoy?`);
  $("chips").style.display = "";
}

async function iniciar() {
  if (!(await cargarMe())) return;
  chat.innerHTML = "";
  if (history.length) { $("chips").style.display = "none"; history.forEach(m => render(m.role, m.content)); }
  else saludo();
  pintarCupo(me.usadas, me.limite); // si ya no le quedan consultas, deja el aviso y bloquea el envío
}

// Arranque: si hay sesión guardada la usa; si no, pide ingreso
(async () => { getSess() ? await iniciar() : mostrarLogin(); })();
</script>
</body>
</html>
